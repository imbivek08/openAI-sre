name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t opensre-api:ci .

      - name: Build demo-api image
        run: docker build -f services/demo-api/Dockerfile -t opensre-demo-api:ci .

      - name: Build dashboard image
        run: docker build -f apps/dashboard/Dockerfile -t opensre-dashboard:ci .
