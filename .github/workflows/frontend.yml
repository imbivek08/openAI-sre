name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: apps/dashboard
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/dashboard
        run: npx next lint || true

      - name: Build
        working-directory: apps/dashboard
        run: npm run build
