services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opensre
      POSTGRES_PASSWORD: opensre
      POSTGRES_DB: opensre
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensre -d opensre"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://opensre:opensre@postgres:5432/opensre
      DEMO_DATABASE_URL: postgresql+asyncpg://opensre:opensre@postgres:5432/opensre_demo
      DEMO_API_URL: http://demo-api:8001
      PROMETHEUS_URL: http://prometheus:9090
      DEMO_LOG_PATH: /var/log/demo-api/app.log
    volumes:
      - demo_logs:/var/log/demo-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      demo-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  demo-api:
    build:
      context: .
      dockerfile: services/demo-api/Dockerfile
    env_file: .env
    environment:
      DEMO_DATABASE_URL: postgresql+asyncpg://opensre:opensre@postgres:5432/opensre_demo
      DEMO_API_PORT: 8001
    volumes:
      - demo_logs:/var/log/demo-api
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - demo-api

  # Optional services — enable with: docker compose --profile grafana up -d
  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["grafana"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3001:3000"

  ollama:
    image: ollama/ollama:0.3.4
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  demo_logs:
  ollama_data:
